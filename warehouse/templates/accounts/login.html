{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Login" %} — Warehouse{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4"><i class="bi bi-boxes me-2"></i>{% trans "Warehouse Login" %}</h3>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}"
                     class="form-control {% if field.errors %}is-invalid{% endif %}"
                     value="{{ field.value|default:'' }}">
              {% for error in field.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary w-100">{% trans "Login" %}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
