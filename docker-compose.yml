# Root-level docker-compose.yml
# Orchestrates ProjectA (Book Shop) + ProjectB (Warehouse) together.
#
# Services:
#   book_shop_db    — PostgreSQL for ProjectA
#   warehouse_db    — PostgreSQL for ProjectB
#   redis           — Shared Redis (ProjectA uses DB 0, ProjectB uses DB 1)
#   book_shop_web   — ProjectA Gunicorn (port 8000)
#   book_shop_celery
#   book_shop_beat
#   warehouse_web   — ProjectB Gunicorn (port 8001)
#   warehouse_celery
#   warehouse_beat
#   nginx           — Port 80 → both services

services:

  # ──────────────────────────────────────────────
  # Shared infrastructure
  # ──────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: shared_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # ProjectA — Book Shop
  # ──────────────────────────────────────────────

  book_shop_db:
    image: postgres:16-alpine
    container_name: book_shop_db
    volumes:
      - book_shop_postgres:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${BOOK_SHOP_DB_NAME:-book_shop}
      POSTGRES_USER: ${BOOK_SHOP_DB_USER:-book_shop_user}
      POSTGRES_PASSWORD: ${BOOK_SHOP_DB_PASSWORD:-book_shop_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOK_SHOP_DB_USER:-book_shop_user} -d ${BOOK_SHOP_DB_NAME:-book_shop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  book_shop_web:
    build:
      context: ./book_shop
      dockerfile: Dockerfile
    container_name: book_shop_web
    volumes:
      - ./book_shop:/app
      - book_shop_static:/app/staticfiles
      - book_shop_media:/app/media
    env_file:
      - ./book_shop/.env
    environment:
      DB_HOST: book_shop_db
      REDIS_URL: redis://redis:6379/0
      WAREHOUSE_API_URL: http://warehouse_web:8001
      WAREHOUSE_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-shared-webhook-secret}
    depends_on:
      book_shop_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  book_shop_celery:
    build:
      context: ./book_shop
      dockerfile: Dockerfile
    container_name: book_shop_celery
    command: celery -A book_shop worker -l info -Q celery
    volumes:
      - ./book_shop:/app
    env_file:
      - ./book_shop/.env
    environment:
      SKIP_INIT: "true"
      DB_HOST: book_shop_db
      REDIS_URL: redis://redis:6379/0
      WAREHOUSE_API_URL: http://warehouse_web:8001
      WAREHOUSE_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-shared-webhook-secret}
    depends_on:
      book_shop_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      book_shop_web:
        condition: service_started
    restart: unless-stopped

  book_shop_beat:
    build:
      context: ./book_shop
      dockerfile: Dockerfile
    container_name: book_shop_beat
    command: celery -A book_shop beat -l info --scheduler celery.beat.PersistentScheduler --schedule /app/celerybeat/celerybeat-schedule
    volumes:
      - ./book_shop:/app
      - book_shop_celerybeat:/app/celerybeat
    env_file:
      - ./book_shop/.env
    environment:
      SKIP_INIT: "true"
      DB_HOST: book_shop_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      book_shop_web:
        condition: service_started
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # ProjectB — Warehouse
  # ──────────────────────────────────────────────

  warehouse_db:
    image: postgres:16-alpine
    container_name: warehouse_db
    volumes:
      - warehouse_postgres:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:-warehouse}
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-warehouse_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER:-warehouse_user} -d ${WAREHOUSE_DB_NAME:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  warehouse_web:
    build:
      context: ./warehouse
      dockerfile: Dockerfile
    container_name: warehouse_web
    volumes:
      - ./warehouse:/app
      - warehouse_static:/app/staticfiles
      - warehouse_media:/app/media
    env_file:
      - ./warehouse/.env
    environment:
      DB_HOST: warehouse_db
      REDIS_URL: redis://redis:6379/1
      BOOK_SHOP_API_URL: http://book_shop_web:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-shared-webhook-secret}
    depends_on:
      warehouse_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  warehouse_celery:
    build:
      context: ./warehouse
      dockerfile: Dockerfile
    container_name: warehouse_celery
    command: celery -A warehouse worker -l info -Q celery
    volumes:
      - ./warehouse:/app
    env_file:
      - ./warehouse/.env
    environment:
      SKIP_INIT: "true"
      DB_HOST: warehouse_db
      REDIS_URL: redis://redis:6379/1
      BOOK_SHOP_API_URL: http://book_shop_web:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-shared-webhook-secret}
    depends_on:
      warehouse_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      warehouse_web:
        condition: service_started
    restart: unless-stopped

  warehouse_beat:
    build:
      context: ./warehouse
      dockerfile: Dockerfile
    container_name: warehouse_beat
    command: celery -A warehouse beat -l info --scheduler celery.beat.PersistentScheduler --schedule /app/celerybeat/celerybeat-schedule
    volumes:
      - ./warehouse:/app
      - warehouse_celerybeat:/app/celerybeat
    env_file:
      - ./warehouse/.env
    environment:
      SKIP_INIT: "true"
      DB_HOST: warehouse_db
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      warehouse_web:
        condition: service_started
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # NGINX — routes traffic to both services
  # ──────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: shared_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - book_shop_static:/app/book_shop/staticfiles:ro
      - book_shop_media:/app/book_shop/media:ro
      - warehouse_static:/app/warehouse/staticfiles:ro
      - warehouse_media:/app/warehouse/media:ro
    depends_on:
      - book_shop_web
      - warehouse_web
    restart: unless-stopped


volumes:
  redis_data:
  book_shop_postgres:
  book_shop_static:
  book_shop_media:
  book_shop_celerybeat:
  warehouse_postgres:
  warehouse_static:
  warehouse_media:
  warehouse_celerybeat:
