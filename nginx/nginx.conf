# Shared NGINX config routing traffic to both ProjectA and ProjectB

upstream book_shop {
    server book_shop_web:8000;
}

upstream warehouse {
    server warehouse_web:8001;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # ── ProjectA static/media ──────────────────────
    location /static/ {
        alias /app/book_shop/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/book_shop/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── ProjectB (Warehouse) — prefix /warehouse/ ──
    location /warehouse/static/ {
        alias /app/warehouse/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /warehouse/media/ {
        alias /app/warehouse/media/;
        expires 7d;
        access_log off;
    }

    location /warehouse/ {
        rewrite ^/warehouse/(.*)$ /$1 break;
        proxy_pass http://warehouse;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /warehouse;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── ProjectA (Book Shop) — root path ──────────
    location / {
        proxy_pass http://book_shop;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
